name: Official Vega runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare display and virtualization
        run: |
          df -h .
          free -m
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool ffmpeg libglu1-mesa libegl1 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 lz4
      - name: Build and run official sample
        run: bash probe.sh
      - name: Collect runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vega-runtime-evidence
          path: temp/evidence/
          retention-days: 3
          if-no-files-found: warn
